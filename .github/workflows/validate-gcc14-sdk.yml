name: Validate shared macOS SDK selection
on:
  push:
    branches: [codex/validate-shared-sdk]
permissions:
  contents: read
jobs:
  native-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, compiler: gcc-14, explicit: false}
          - {os: macos-latest, compiler: clang-20, explicit: false}
          - {os: macos-15, compiler: clang-18, explicit: false}
          - {os: macos-latest, compiler: clang-20, explicit: true}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test SDK selection policy
        run: |
          xcode-select -p > "$RUNNER_TEMP/developer-before"
          python3 tests/test-gcc-sdk.py
      - name: Choose an explicit SDK for this test
        if: matrix.explicit
        id: sdk
        shell: bash
        run: |
          sdk=$(env -u SDKROOT xcrun --sdk macosx --show-sdk-path)
          echo "path=$sdk" >> "$GITHUB_OUTPUT"
      - uses: ./setup-compiler
        env:
          SDKROOT: ${{ steps.sdk.outputs.path }}
        with:
          compiler: ${{ matrix.compiler }}
      - name: Compile and run with selected SDK
        env:
          EXPECTED_SDK: ${{ steps.sdk.outputs.path }}
        shell: bash
        run: |
          printf 'Selected SDK: %s\n' "$SDKROOT"
          test -d "$SDKROOT"
          if [[ -n "$EXPECTED_SDK" ]]; then test "$SDKROOT" = "$EXPECTED_SDK"; fi
          test "$(xcode-select -p)" = "$(cat "$RUNNER_TEMP/developer-before")"
          mkdir probe
          cat > probe/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.18)
          project(sdk_probe LANGUAGES C CXX)
          add_executable(sdk_c main.c)
          add_executable(sdk_probe main.cpp)
          target_compile_features(sdk_probe PRIVATE cxx_std_20)
          target_compile_options(sdk_probe PRIVATE -Wall -Wextra -Werror)
          CMAKE
          cat > probe/main.c <<'C'
          #include <mach/mach.h>
          #include <sys/sysctl.h>
          int main(void) { return 0; }
          C
          cat > probe/main.cpp <<'CPP'
          #include <mach/mach.h>
          #include <sys/sysctl.h>
          #include <vector>
          #include <stdexcept>
          struct Error : std::runtime_error { using std::runtime_error::runtime_error; };
          struct Result { Result() { throw Error("expected"); } };
          Result make_result() { return Result(); }
          int main() {
              try { make_result(); return 1; } catch (const Error &) {}
              std::vector<int> values{1, 2, 3};
              return values.size() != 3;
          }
          CPP
          cmake -S probe -B probe/build -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX"
          cmake --build probe/build --parallel 2
          ./probe/build/sdk_c
          ./probe/build/sdk_probe
